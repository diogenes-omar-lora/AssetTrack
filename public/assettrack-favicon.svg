<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="8" fill="#3b82f6"/>
  
  <!-- Stacked boxes representing inventory/assets -->
  <g fill="white">
    <!-- Bottom box -->
    <rect x="12" y="32" width="40" height="20" rx="2"/>
    <!-- Middle box -->
    <rect x="16" y="20" width="32" height="16" rx="2"/>
    <!-- Top box -->
    <rect x="20" y="10" width="24" height="12" rx="2"/>
    
    <!-- Details/lines on boxes -->
    <line x1="12" y1="38" x2="52" y2="38" stroke="#3b82f6" stroke-width="1"/>
    <line x1="16" y1="26" x2="48" y2="26" stroke="#3b82f6" stroke-width="1"/>
  </g>
</svg>